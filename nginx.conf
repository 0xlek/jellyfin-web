server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = / {
        return 302 /web/;
    }

    # Everything not hashed (the shell, themes, manifest, icons, service worker) is revalidated on each load,
    # which costs a 304 at most thanks to ETag and Last-Modified
    location /web/ {
        add_header Cache-Control "no-cache";
        # The app uses browser-history routes (/web/watch?v=…): unknown paths get the app shell
        try_files $uri $uri/ /web/index.html;
    }

    # Hashed build output never changes under the same name
    location /web/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /web/index.html {
        add_header Cache-Control "no-cache";
    }
}
