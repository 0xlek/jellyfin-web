name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: jellyfin-web
    steps:
      # Keep the runner's internal addresses out of the public logs
      - run: |
          for url in "$npm_config_registry" "$LOCAL_S3_ENDPOINT"; do
            [ -n "$url" ] || continue
            host=${url#*://}; host=${host%%/*}
            echo "::add-mask::$url"; echo "::add-mask::$host"; echo "::add-mask::${host%%:*}"
          done
      # Actions are pinned to commit SHAs; tags can be moved by whoever controls the action repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # pnpm 11 reads only pnpm_config_registry; the runner sets npm_config_registry
      - run: echo "pnpm_config_registry=$npm_config_registry" >> "$GITHUB_ENV"
      # The lockfile is re-checked against minimumReleaseAge from pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm stylelint
      - run: pnpm build:check
      - run: pnpm test
      - run: pnpm build:production
